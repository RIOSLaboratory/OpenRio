<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DUT 验证架构流程</title>
<style>
  :root { --line:#222; }
  body { font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
         margin:24px; color:#222; background:#fff; }
  .stage { position:relative; width:1460px; height:400px; }

  .box {
    position:absolute; box-sizing:border-box;
    border:2px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center;
    text-align:center; font-weight:600; font-size:16px; line-height:1.3;
  }
  .box.sm { font-size:14px; }

  .label { position:absolute; font-size:15px; font-style:italic;
           white-space:nowrap; transform:translateX(-50%); }
  .annot { position:absolute; font-size:15px;
           white-space:nowrap; transform:translateX(-50%); }

  .h { position:absolute; height:2px; background:var(--line); }
  .h.right::after {
    content:""; position:absolute; right:-2px; top:-5px;
    width:0; height:0; border-style:solid;
    border-width:6px 0 6px 11px;
    border-color:transparent transparent transparent var(--line);
  }
  .h.left::before {
    content:""; position:absolute; left:-2px; top:-5px;
    width:0; height:0; border-style:solid;
    border-width:6px 11px 6px 0;
    border-color:transparent var(--line) transparent transparent;
  }
  .v { position:absolute; width:2px; background:var(--line); }
</style>
</head>
<body>

<div class="stage">

  <!-- ===== 方块 ===== -->
  <div class="box"    style="left:30px;   top:45px;  width:96px;  height:136px;">FE_Agent</div>
  <div class="box"    style="left:250px;  top:75px;  width:140px; height:76px;">DUT</div>
  <div class="box sm" style="left:545px;  top:45px;  width:110px; height:136px;">Cache_Agent</div>
  <div class="box sm" style="left:705px;  top:175px; width:68px;  height:170px;">adapter</div>
  <div class="box sm" style="left:1020px; top:190px; width:100px; height:46px;">be-agent</div>
  <div class="box sm" style="left:1180px; top:190px; width:112px; height:46px;">isa_model</div>
  <div class="box sm" style="left:1350px; top:140px; width:76px;  height:200px;">checker</div>

  <!-- ===== 连线 ===== -->
  <!-- FE_Agent <-> DUT -->
  <div class="h left right" style="left:126px; top:112px; width:124px;"></div>
  <div class="label"        style="left:188px; top:88px;">orbe_fe_if</div>

  <!-- DUT <-> Cache_Agent -->
  <div class="h left right" style="left:390px; top:112px; width:155px;"></div>
  <div class="label"        style="left:467px; top:88px;">or_be_lsu_if</div>

  <!-- DUT -> adapter（提取 DUT 中信号） -->
  <div class="v"       style="left:319px; top:151px; height:155px;"></div>
  <div class="h right" style="left:319px; top:304px; width:386px;"></div>
  <div class="annot"   style="left:500px; top:318px;">提取 DUT 中信号</div>

  <!-- Cache_Agent -> adapter -->
  <div class="v"       style="left:599px; top:181px; height:33px;"></div>
  <div class="h right" style="left:599px; top:212px; width:106px;"></div>

  <!-- adapter -> be-agent（ob_if） -->
  <div class="h right" style="left:773px; top:212px; width:247px;"></div>
  <div class="label"   style="left:890px; top:188px;">ob_if</div>

  <!-- be-agent -> isa_model（驱动） -->
  <div class="h right" style="left:1120px; top:212px; width:60px;"></div>
  <div class="annot"   style="left:1150px; top:178px;">驱动</div>

  <!-- isa_model -> checker -->
  <div class="h right" style="left:1292px; top:212px; width:58px;"></div>

  <!-- adapter -> checker（checker_if） -->
  <div class="h right" style="left:773px; top:304px; width:577px;"></div>
  <div class="label"   style="left:900px; top:281px;">checker_if</div>

</div>

</body>
</html>
